<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI短视频脚本平台</title>
    <style id="theme-vars">
/* ========================================
   AI短视频脚本平台 — 科技感暗色主题
   Retro-futuristic / AI Creative Tool
   ======================================== */

:root {
  /* ── Color System ── */
  --color-bg-primary: #08090d;
  --color-bg-secondary: #0f1117;
  --color-bg-tertiary: #161822;
  --color-bg-elevated: #1c1f2e;
  --color-bg-hover: #232738;
  --color-bg-active: #2a2f42;

  --color-border-default: #1e2233;
  --color-border-subtle: #181b28;
  --color-border-strong: #2a2f45;
  --color-border-focus: #06d6a0;

  --color-text-primary: #e8ecf4;
  --color-text-secondary: #8892a8;
  --color-text-tertiary: #5a6478;
  --color-text-inverse: #08090d;

  /* Brand Primary — Cyan/Mint */
  --color-primary: #06d6a0;
  --color-primary-hover: #34e0b5;
  --color-primary-muted: rgba(6, 214, 160, 0.10);
  --color-primary-subtle: rgba(6, 214, 160, 0.05);

  /* Secondary Accent — Electric Blue */
  --color-accent: #4cc9f0;
  --color-accent-muted: rgba(76, 201, 240, 0.10);

  /* State Colors */
  --state-success: #06d6a0;
  --state-warning: #ffd166;
  --state-error: #ef476f;
  --state-info: #4cc9f0;

  /* ── Typography ── */
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Radius ── */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;

  /* ── Shadows (border-first for static; deeper for floating) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.05);
  --shadow-floating: 0 12px 40px rgba(0, 0, 0, 0.4);

  /* Brand glow (not a standard shadow — for primary emphasis only) */
  --shadow-glow: 0 0 20px rgba(6, 214, 160, 0.15);
  --shadow-glow-strong: 0 0 40px rgba(6, 214, 160, 0.25);
  --shadow-glow-accent: 0 0 20px rgba(76, 201, 240, 0.15);

  /* ── Transitions ── */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --duration: 200ms;
  --duration-slow: 300ms;

  /* ── Z-index ── */
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-modal: 300;
  --z-toast: 400;
}

/* ── Dark mode defaults ── */
html.dark {
  background-color: var(--color-bg-primary);
  color: var(--color-text-primary);
}

body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  letter-spacing: var(--tracking-normal);
  color: var(--color-text-primary);
  background-color: var(--color-bg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Typography ── */
.heading-xl { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--weight-bold); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
.heading-lg { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); }
.heading-md { font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); }
.heading-sm { font-family: var(--font-display); font-size: var(--text-lg); font-weight: var(--weight-medium); line-height: var(--leading-tight); }
.mono { font-family: var(--font-mono); font-size: var(--text-sm); }

/* ── Surface & Card ── */
.surface { background-color: var(--color-bg-secondary); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); }
.surface-elevated { background-color: var(--color-bg-tertiary); border: 1px solid var(--color-border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }

/* ── Gradient accents ── */
.gradient-primary { background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); }
.gradient-text { background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

/* ── Glow effects ── */
.glow-primary { box-shadow: var(--shadow-glow); }
.glow-strong { box-shadow: var(--shadow-glow-strong); }
.glow-accent { box-shadow: var(--shadow-glow-accent); }

/* ── Neon border effect ── */
.neon-border { border: 1px solid rgba(6, 214, 160, 0.2); box-shadow: inset 0 0 20px rgba(6, 214, 160, 0.03); }
.neon-border-accent { border: 1px solid rgba(76, 201, 240, 0.2); box-shadow: inset 0 0 20px rgba(76, 201, 240, 0.03); }

/* ── Grid background pattern ── */
.grid-bg {
  background-image:
    linear-gradient(rgba(6, 214, 160, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6, 214, 160, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }

/* ── Animations ── */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes glowPulse { 0%, 100% { box-shadow: 0 0 15px rgba(6, 214, 160, 0.1); } 50% { box-shadow: 0 0 30px rgba(6, 214, 160, 0.2); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
@keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }

.animate-fade-in { animation: fadeIn var(--duration) var(--ease); }
.animate-slide-up { animation: slideUp var(--duration-slow) var(--ease); }
.animate-scale-in { animation: scaleIn var(--duration-slow) var(--ease); }
.animate-glow-pulse { animation: glowPulse 3s ease-in-out infinite; }
.animate-float { animation: float 4s ease-in-out infinite; }
.animate-grid-move { animation: gridMove 20s linear infinite; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
  }
  @layer base {
    body { background: var(--color-bg-primary); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background-color: var(--color-bg-primary);">

  <!-- Full-screen background layers -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <!-- Animated grid pattern -->
    <div class="absolute inset-0 grid-bg animate-grid-move"></div>

    <!-- Center radial gradient glow -->
    <div class="absolute inset-0" style="background: radial-gradient(ellipse at center, rgba(6,214,160,0.06) 0%, transparent 60%);"></div>

    <!-- Scanline effect -->
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute left-0 w-full" style="height: 2px; background: linear-gradient(90deg, transparent, rgba(6,214,160,0.08), transparent); animation: scanline 8s linear infinite;"></div>
    </div>

    <!-- Floating gradient orb — top right -->
    <div class="absolute -top-32 -right-32 rounded-full animate-float" style="width: 400px; height: 400px; background: var(--color-primary-muted); filter: blur(100px); animation-delay: 0s;"></div>

    <!-- Floating gradient orb — bottom left -->
    <div class="absolute -bottom-32 -left-32 rounded-full animate-float" style="width: 350px; height: 350px; background: var(--color-accent-muted); filter: blur(100px); animation-delay: 2s;"></div>

    <!-- Subtle particle dots -->
    <div class="absolute top-[12%] left-[8%] w-1 h-1 rounded-full" style="background: var(--color-primary); opacity: 0.3;"></div>
    <div class="absolute top-[25%] right-[15%] w-0.5 h-0.5 rounded-full" style="background: var(--color-accent); opacity: 0.25;"></div>
    <div class="absolute top-[60%] left-[5%] w-0.5 h-0.5 rounded-full" style="background: var(--color-primary); opacity: 0.2;"></div>
    <div class="absolute bottom-[20%] right-[10%] w-1 h-1 rounded-full" style="background: var(--color-accent); opacity: 0.2;"></div>
    <div class="absolute top-[40%] right-[6%] w-0.5 h-0.5 rounded-full" style="background: var(--color-primary); opacity: 0.15;"></div>
    <div class="absolute bottom-[35%] left-[12%] w-1 h-1 rounded-full" style="background: var(--color-accent); opacity: 0.18;"></div>
  </div>

  <!-- Main content -->
  <main class="relative z-10 flex items-center justify-center min-h-screen px-4 py-8">
    <div class="w-full max-w-md animate-slide-up">

      <!-- Logo + Brand -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 rounded-2xl gradient-primary animate-glow-pulse flex items-center justify-center mb-4">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="heading-xl gradient-text" style="text-wrap: balance; word-break: keep-all;">AI短视频脚本平台</h1>
      </div>

      <!-- Login Card -->
      <div class="neon-border rounded-xl p-8" style="background-color: var(--color-bg-secondary);">
        <div class="mb-6">
          <h2 class="heading-md mb-1" style="color: var(--color-text-primary); text-wrap: balance; word-break: keep-all;">登录到您的账户</h2>
          <p class="text-sm" style="color: var(--color-text-secondary);">使用您的账户继续创作</p>
        </div>

        <!-- Error state (sample) -->
        <div class="mb-5 px-4 py-3 rounded-lg" style="background: rgba(239, 71, 111, 0.1); border-left: 3px solid var(--state-error);">
          <p class="text-sm" style="color: var(--state-error);">用户名或密码错误</p>
        </div>

        <form onsubmit="return false;" class="space-y-5">
          <!-- Username -->
          <div>
            <label for="username" class="block text-sm font-medium mb-2" style="color: var(--color-text-secondary);">用户名</label>
            <input
              id="username"
              type="text"
              placeholder="输入用户名"
              autocomplete="username"
              class="w-full px-4 py-3 rounded-lg text-sm outline-none transition-all duration-200"
              style="background-color: var(--color-bg-tertiary); border: 1px solid var(--color-border-default); color: var(--color-text-primary);"
              onfocus="this.style.borderColor='var(--color-border-focus)'; this.style.boxShadow='0 0 0 3px rgba(6,214,160,0.1)';"
              onblur="this.style.borderColor='var(--color-border-default)'; this.style.boxShadow='none';"
            >
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium mb-2" style="color: var(--color-text-secondary);">密码</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password"
                class="w-full px-4 py-3 rounded-lg text-sm outline-none transition-all duration-200 pr-11"
                style="background-color: var(--color-bg-tertiary); border: 1px solid var(--color-border-default); color: var(--color-text-primary);"
                onfocus="this.style.borderColor='var(--color-border-focus)'; this.style.boxShadow='0 0 0 3px rgba(6,214,160,0.1)';"
                onblur="this.style.borderColor='var(--color-border-default)'; this.style.boxShadow='none';"
              >
              <button
                type="button"
                aria-label="切换密码可见性"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded transition-opacity duration-200"
                style="color: var(--color-text-tertiary);"
                onmouseover="this.style.opacity='0.8';"
                onmouseout="this.style.opacity='1';"
                onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';"
              >
                <i data-lucide="eye" style="width:18px;height:18px;"></i>
              </button>
            </div>
          </div>

          <!-- Login Button -->
          <button
            type="submit"
            class="w-full gradient-primary rounded-lg py-3 text-sm font-semibold transition-all duration-200 cursor-pointer"
            style="color: white; border: none;"
            onmouseover="this.style.boxShadow='var(--shadow-glow-strong)'; this.style.transform='translateY(-1px)';"
            onmouseout="this.style.boxShadow='none'; this.style.transform='translateY(0)';"
            onmousedown="this.style.transform='translateY(0)';"
            onmouseup="this.style.transform='translateY(-1px)';"
          >
            登录
          </button>
        </form>

        <!-- Register link -->
        <p class="mt-6 text-center text-sm" style="color: var(--color-text-secondary);">
          还没有账户？
          <a href="#" class="transition-colors duration-200" style="color: var(--color-primary);" onmouseover="this.style.color='var(--color-primary-hover)';" onmouseout="this.style.color='var(--color-primary)';">立即注册</a>
        </p>
      </div>

    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
