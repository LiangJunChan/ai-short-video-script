services:
  backend:
    build: ./backend
    container_name: avs-backend
    # chromium(抖音提取)默认 /dev/shm 64MB 会导致 Page crashed,提到 512MB 双保险
    shm_size: "512mb"
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      # 视频/缩略图/音频 挂 host 目录(路径与 Go 代码硬编码的 ../uploads 对齐)
      - ./uploads:/uploads
      # 抖音登录态(方案A): 含 sessionid 等凭证,不进镜像/git,只读挂载
      - ./backend/douyin_state.json:/app/douyin_state.json:ro
      - ./thumbnails:/thumbnails
      - ./audio:/audio
      # SQLite 数据库挂 host 目录(db.go 用 DB_PATH env 指向 /data/videos.db)
      - ./data:/data
    environment:
      - ASR_URL=http://asr:8000/asr
      - PYTHON_BIN=/usr/local/bin/python
      - DOCKER=1
      - DB_PATH=/data/videos.db
    depends_on:
      - asr
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: avs-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  asr:
    build:
      context: ./asr
      args:
        # 引擎选择: sherpa(低内存,默认) / funasr(高内存)
        # 可在 .env 或 shell 设 ASR_ENGINE 覆盖;bootstrap-docker.sh 按内存自动设置。
        ASR_ENGINE: ${ASR_ENGINE:-sherpa}
    container_name: avs-asr
    ports:
      - "8000:8000"
    environment:
      # 容器内 FastAPI 必须绑 0.0.0.0 才能让其它容器(backend)访问,本机开发默认 127.0.0.1
      - ASR_HOST=0.0.0.0
      # 运行期也传一份 ASR_ENGINE(app.py 读它选引擎),与构建期保持一致
      - ASR_ENGINE=${ASR_ENGINE:-sherpa}
    # sherpa: int8 模型随镜像打包;funasr: 模型运行时由 modelscope 下载并缓存到卷
    volumes:
      - modelscope-cache:/root/.cache/modelscope
    restart: unless-stopped

volumes:
  modelscope-cache:

