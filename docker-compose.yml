services:
  backend:
    build: ./backend
    container_name: avs-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      # 视频/缩略图/音频 挂 host 目录(路径与 Go 代码硬编码的 ../uploads 对齐)
      - ./uploads:/uploads
      - ./thumbnails:/thumbnails
      - ./audio:/audio
      # SQLite 数据库挂 host 目录(db.go 用 DB_PATH env 指向 /data/videos.db)
      - ./data:/data
    environment:
      - ASR_URL=http://asr:8000/asr
      - PYTHON_BIN=/usr/local/bin/python
      - DOCKER=1
      - DB_PATH=/data/videos.db
    depends_on:
      - asr
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: avs-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  asr:
    build: ./asr
    container_name: avs-asr
    ports:
      - "8000:8000"
    volumes:
      # FunASR 1.9G 模型缓存到 host,重启不用重下
      - modelscope-cache:/root/.cache/modelscope
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  modelscope-cache:
  hf-cache:
