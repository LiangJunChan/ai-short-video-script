# frontend/nginx.conf — 容器内 nginx,serve 前端 dist + 反代 /api 到 backend 服务
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 单页应用:所有前端路由都走 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 容器(compose 里服务名 = backend)
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传大文件(4GB 上限)+ 长连接(ASR / 工作流轮询)
        client_max_body_size 4G;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_buffering      off;
    }

    # 静态资源直接透传到 backend(视频文件 / 缩略图)
    location ~ ^/(uploads|thumbnails|video)/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host $host;
        proxy_read_timeout 600s;
    }
}
